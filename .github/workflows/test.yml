name: test

# 这个项目要装到所有人的机器上，所以"在我这台机器上能跑"不算验证。
# 每次推送跑 ubuntu + windows 两个平台 × 两个 Node 版本——
# 其中 22.15.0 是 package.json 里声明的最低版本，等于顺带验证
# "engines 那句话是不是真的"。
#
# macOS 只在手动触发（workflow_dispatch）时跑，原因不是省事：
# 私有仓库拿不到 macOS runner——实测每个 macOS job 都在排队 901 秒
# （15 分钟上限）后被取消，一个步骤都没跑过，于是每次推送都是红的。
# 常年红的门等于没有门。发布前手动点一次，把 macOS 补上。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest","windows-latest"]') }}
        node: ['22.15.0', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 运行时能力自检
        # 先确认这台机器上的 Node 真有 zstd 和 node:sqlite，
        # 免得后面失败时报一个看不出根因的错
        run: node -e "const z=require('node:zlib');if(typeof z.zstdDecompressSync!=='function'){console.error('缺 zstd');process.exit(1)}if(typeof require('node:sqlite').DatabaseSync!=='function'){console.error('缺 node:sqlite');process.exit(1)}console.log('ok',process.version,process.platform)"

      # 没有 npm 依赖，所以不需要 install —— 也正因为如此，
      # 这一步在任何平台上都不会因为网络或原生模块编译失败。
      - name: 单元与契约测试
        run: npm test

  package:
    name: 安装包可发布性
    # 只看一个平台：这里验的是 files 白名单与 bin 入口，跟平台无关
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: npm pack 内容
        run: |
          npm pack --dry-run
          # 包里不该出现别人的源码副本和测试
          if npm pack --dry-run 2>&1 | grep -q 'reference-src\|^.*test/'; then
            echo "打包内容里混进了 research/ 或 test/"
            exit 1
          fi

      - name: 装出来的包能跑
        # 用户的第一个动作是「装」，而 --dry-run 只看打包内容、不看装完能不能用。
        # 这里真的装一遍、真的跑一次——包括两个入口是否都生成了。
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/inst" && cd "$RUNNER_TEMP/inst"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/agent-archive-*.tgz

          # 家目录与平台默认根都指到临时目录：既不读 runner 上的东西，结果也稳定
          export HOME="$RUNNER_TEMP/home" USERPROFILE="$RUNNER_TEMP/home"
          export APPDATA="$RUNNER_TEMP/appdata" LOCALAPPDATA="$RUNNER_TEMP/localappdata"
          export AGENT_ARCHIVE_HOME="$RUNNER_TEMP/state"
          # 各家的覆盖变量也要清掉：runner 上通常没有，但本机跑同一个脚本时会漏
          unset DSH_HOME HERMES_HOME CODEX_HOME CLAUDE_CONFIG_DIR QODER_CONFIG_DIR CURSOR_CONFIG_DIR KIRO_HOME
          mkdir -p "$HOME" "$APPDATA" "$LOCALAPPDATA" "$AGENT_ARCHIVE_HOME"

          echo "--- 两个入口都要在"
          ls node_modules/.bin/agent-archive node_modules/.bin/agent-archive-mcp

          echo "--- 空家目录下跑一次，必须正常退出"
          ./node_modules/.bin/agent-archive projects

  privacy:
    name: 隐私检查
    # 这是个公开仓库：真实项目名、本机路径、密钥一旦提交就等于公开，
    # 而它们不会让任何测试失败。所以单独一道门，只查被跟踪的文件。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run privacy
